name: Add Repo from Issue

on:
  issues:
    types: [opened, reopened]

jobs:
  add-repo:
    if: contains(github.event.issue.labels.*.name, 'add-repo')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Parse issue and add repo entry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/add_repo_from_issue.py

      - name: Commit and push new entry
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          COMMIT_MSG=$(cat /tmp/add_repo_commit_msg.txt 2>/dev/null || echo "feat: add repo from issue #${{ github.event.issue.number }}")
          git commit -m "$COMMIT_MSG"
          git push

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENTRY_PATH=$(cat /tmp/add_repo_entry_path.txt 2>/dev/null || echo "unknown path")
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ Entry added to \`${ENTRY_PATH}\` and committed to \`main\`. Closing this issue."
          gh issue close ${{ github.event.issue.number }}
